name: Legado iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "构建号（写进 Info.plist 的 CFBundleVersion）"
        required: true
        default: "22"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj -scheme Legado -resolvePackageDependencies 2>&1 | tail -20

      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj -scheme Legado \
            -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -80

      - name: Package IPA
        if: success()
        run: |
          set -euo pipefail
          APP=build/DeviceDerivedData/Build/Products/Release-iphoneos/Legado.app
          test -d "$APP"
          rm -rf dist && mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" dist/Payload/Legado.app/Info.plist || true
          brew install ldid >/dev/null 2>&1 || true
          LDID=$(command -v ldid || echo /opt/homebrew/bin/ldid)
          "$LDID" -S dist/Payload/Legado.app/Legado || true
          find dist/Payload -name '*.dylib' -print0 | while IFS= read -r -d '' f; do "$LDID" -S "$f" || true; done
          ( cd dist && zip -qry "legado-ios-v0.1.15-build${{ inputs.build_number }}-unsigned.ipa" Payload )
          ls -lh dist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' dist/Payload/Legado.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Payload/Legado.app/Info.plist || true

      - name: Collect symbols
        if: success()
        run: |
          set -euo pipefail
          APP=build/DeviceDerivedData/Build/Products/Release-iphoneos/Legado.app
          # Release 会 strip 掉 .app 里的符号，但 dSYM 里的 DWARF 是完整的。
          # 崩溃报告给的是「binaryUUID + 段内偏移」，有这张地址表就能反查出函数名。
          DWARF="$APP.dSYM/Contents/Resources/DWARF/Legado"
          {
            echo "# binary uuid"
            dwarfdump --uuid "$APP/Legado" || true
            echo "# text segment vmaddr"
            otool -l "$APP/Legado" | awk '/segname __TEXT/{f=1} f&&/vmaddr/{print; f=0}' || true
            echo "# symbols"
            nm -arch arm64 -n "$DWARF" 2>/dev/null | awk '$2 ~ /^[tT]$/ {print $1" "$3}' || true
          } > dist/symbols.txt
          wc -l dist/symbols.txt

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-symbols
          path: dist/symbols.txt
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn
