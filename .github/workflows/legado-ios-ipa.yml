name: Legado iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "构建号（写进 Info.plist 的 CFBundleVersion）"
        required: true
        default: "57"

permissions:
  contents: read

jobs:
  build:
    # 同时排三个池子：arm64 的 macos-15 最挤，Intel 的 macos-15-intel 和
    # 老机型 macos-14 是独立队列，谁先拿到机器谁先编。免费 macOS runner
    # 排队超过 15 分钟会被 GitHub 自动取消，只能靠多池并行提高命中率。
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner: [macos-15, macos-15-intel, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pick newest Xcode
        run: |
          set -euo pipefail
          # 三个镜像预装的 Xcode 版本不一样（macos-14 上没有 26.x），
          # 统一挑镜像里版本号最高的那个，避免写死 DEVELOPER_DIR 找不到。
          best=""
          bestver="0"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            major=$(echo "$v" | cut -d. -f1)
            [ -n "$major" ] || major=0
            if [ "$major" -gt "$bestver" ] 2>/dev/null; then
              bestver="$major"; best="$app"
            fi
          done
          if [ -z "$best" ]; then echo "no Xcode found"; ls /Applications; exit 1; fi
          # 工程用 SWIFT_VERSION 6.0，需要 Swift 6 编译器（Xcode 16+）
          if [ "$bestver" -lt 16 ]; then
            echo "错误：$best 是 Xcode $bestver，编不了 Swift 6，跳过这台"
            exit 1
          fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          echo "picked: $best"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj -scheme Legado -resolvePackageDependencies 2>&1 | tail -20

      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj -scheme Legado \
            -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -80

      - name: Package IPA
        if: success()
        run: |
          set -euo pipefail
          APP=build/DeviceDerivedData/Build/Products/Release-iphoneos/Legado.app
          test -d "$APP"
          rm -rf dist && mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" dist/Payload/Legado.app/Info.plist || true
          brew install ldid >/dev/null 2>&1 || true
          # Intel 镜像的 brew 前缀是 /usr/local，Apple Silicon 是 /opt/homebrew
          LDID=$(command -v ldid || true)
          [ -x "$LDID" ] || LDID=/usr/local/bin/ldid
          [ -x "$LDID" ] || LDID=/opt/homebrew/bin/ldid
          echo "ldid: $LDID"
          "$LDID" -S dist/Payload/Legado.app/Legado || true
          find dist/Payload -name '*.dylib' -print0 | while IFS= read -r -d '' f; do "$LDID" -S "$f" || true; done
          ( cd dist && zip -qry "legado-ios-v0.1.15-build${{ inputs.build_number }}-unsigned.ipa" Payload )
          ls -lh dist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' dist/Payload/Legado.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Payload/Legado.app/Info.plist || true

      - name: Collect symbols
        if: success()
        run: |
          set -euo pipefail
          APP=build/DeviceDerivedData/Build/Products/Release-iphoneos/Legado.app
          # Release 会 strip 掉 .app 里的符号，但 dSYM 里的 DWARF 是完整的。
          # 崩溃报告给的是「binaryUUID + 段内偏移」，有这张地址表就能反查出函数名。
          DWARF="$APP.dSYM/Contents/Resources/DWARF/Legado"
          {
            echo "# binary uuid"
            dwarfdump --uuid "$APP/Legado" || true
            echo "# text segment vmaddr"
            otool -l "$APP/Legado" | awk '/segname __TEXT/{f=1} f&&/vmaddr/{print; f=0}' || true
            echo "# symbols"
            nm -arch arm64 -n "$DWARF" 2>/dev/null | awk '$2 ~ /^[tT]$/ {print $1" "$3}' || true
          } > dist/symbols.txt
          wc -l dist/symbols.txt

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-ipa-${{ matrix.runner }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-symbols-${{ matrix.runner }}
          path: dist/symbols.txt
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: /tmp/xcodebuild.log
          if-no-files-found: warn
